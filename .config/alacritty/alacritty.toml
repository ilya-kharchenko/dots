[window]
padding = { x = 3, y = 3 }
dynamic_title = true

[font]
size = 13.5

[font.offset]
y = 4

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Light"

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Medium"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Light"

[font.bold_italic]
family = "JetBrainsMono Nerd Font"
style = "Medium"

[cursor]
style = { shape = "Block", blinking = "Off" }

[general]
live_config_reload = true
import = ["./colors.toml"]

[scrolling]
history = 50000
